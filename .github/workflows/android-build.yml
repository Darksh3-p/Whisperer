name: Whisperer Android CI

# Builds the debug APK WITH the on-device AI runtimes:
#   - llama.cpp   (assistant model, GGUF)        -> :llama   (native, arm64-v8a)
#   - whisper.cpp (speech recognition, ggml .bin) -> :whisper (native, arm64-v8a)
#   - sherpa-onnx (voice packs / neural TTS)      -> prebuilt libs + Kotlin API from the latest release
# The sources are fetched into third_party/ at build time; the Gradle build detects them automatically.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp tag/branch/commit"
        required: false
        default: "b6000"
      whisper_ref:
        description: "whisper.cpp tag/branch/commit"
        required: false
        default: "v1.7.6"
      sherpa_tag:
        description: "sherpa-onnx release tag (empty = latest release)"
        required: false
        default: ""

permissions:
  contents: read

env:
  LLAMA_REF: ${{ github.event.inputs.llama_ref || 'b6000' }}
  WHISPER_REF: ${{ github.event.inputs.whisper_ref || 'v1.7.6' }}
  SHERPA_TAG: ${{ github.event.inputs.sherpa_tag || '' }}
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    name: Build debug APK (with AI runtimes)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (platform, build-tools, NDK, CMake)
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # ---- native sources -------------------------------------------------------------------
      - name: Fetch llama.cpp (${{ env.LLAMA_REF }})
        shell: bash
        run: |
          mkdir -p third_party/llama.cpp && cd third_party/llama.cpp
          git init -q
          git fetch --depth 1 https://github.com/ggml-org/llama.cpp "$LLAMA_REF"
          git checkout -q FETCH_HEAD
          rm -rf .git

      - name: Fetch whisper.cpp (${{ env.WHISPER_REF }})
        shell: bash
        run: |
          mkdir -p third_party/whisper.cpp && cd third_party/whisper.cpp
          git init -q
          git fetch --depth 1 https://github.com/ggml-org/whisper.cpp "$WHISPER_REF"
          git checkout -q FETCH_HEAD
          rm -rf .git

      - name: Fetch sherpa-onnx prebuilt Android libraries and Kotlin API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$SHERPA_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo k2-fsa/sherpa-onnx --json tagName -q .tagName)"
          fi
          echo "sherpa-onnx tag: $TAG"
          mkdir -p sherpa_dl && cd sherpa_dl
          gh release download "$TAG" --repo k2-fsa/sherpa-onnx --pattern 'sherpa-onnx-v*-android.tar.bz2'
          ls -la
          tar xjf sherpa-onnx-v*-android.tar.bz2
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp sherpa_dl/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a/
          # Kotlin API at exactly the same tag, so it matches the native library.
          git clone --depth 1 --branch "$TAG" https://github.com/k2-fsa/sherpa-onnx sherpa_src
          mkdir -p third_party/sherpa-onnx-kotlin
          cp sherpa_src/sherpa-onnx/kotlin-api/*.kt third_party/sherpa-onnx-kotlin/
          test -f third_party/sherpa-onnx-kotlin/Tts.kt
          rm -rf sherpa_dl sherpa_src

      # ---- gradle wrapper -------------------------------------------------------------------
      - name: Provide Gradle CLI (only needed to create a missing wrapper JAR)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Create Gradle wrapper JAR if it is missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && gradle wrapper --gradle-version 9.6.1 --distribution-type bin --no-daemon)
          mkdir -p gradle/wrapper
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK contents (native libraries)
        shell: bash
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          ls -la "$APK"
          unzip -l "$APK" | grep -E "\.so$" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whisperer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  unit-tests:
    # Separate job: a failing unit test never blocks the APK build above. No native code needed here.
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Provide Gradle CLI (only needed to create a missing wrapper JAR)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Create Gradle wrapper JAR if it is missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && gradle wrapper --gradle-version 9.6.1 --distribution-type bin --no-daemon)
          mkdir -p gradle/wrapper
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Make wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: whisperer-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
